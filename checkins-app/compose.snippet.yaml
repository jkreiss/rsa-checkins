# Paste these under `services:` in the server's compose file.
# The app folder is copied to ./checkins next to that compose file.
# Before the first `up`, create the data folder owned by uid 1000 (the app's user in the image),
# or Docker creates it as root and the app can't write its database:
#   mkdir -p ~/rsa-automations/data/checkins && id -u        # must print 1000
#   (if not 1000: sudo chown 1000:1000 ~/rsa-automations/data/checkins)
  checkins:
    image: rsa-checkins:latest
    build: ./checkins
    restart: unless-stopped
    ports:
      - "127.0.0.1:8502:8501"
    env_file: ./checkins/.env
    environment:
      TZ: Australia/Sydney
    volumes:
      - ./data/checkins:/app/data
    logging:
      driver: local

  checkins-worker:
    image: rsa-checkins:latest
    restart: unless-stopped
    command: ["python", "-m", "rsa_checkins.worker"]
    env_file: ./checkins/.env
    environment:
      TZ: Australia/Sydney
    volumes:
      - ./data/checkins:/app/data
    depends_on:
      - checkins
    logging:
      driver: local
